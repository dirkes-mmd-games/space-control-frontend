<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <meta name="description" content="Space Control – Spieleranmeldung">
  <title>Space Control – Spieleranmeldung</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #26344a, #10151f 58%); color: #f8fafc; }
    main { width: min(100%, 440px); padding: 30px; border: 1px solid #344256; border-radius: 22px; background: rgba(20, 29, 43, .96); box-shadow: 0 24px 70px #0008; }
    .mark { font-size: 13px; letter-spacing: .2em; color: #93c5fd; font-weight: 700; }
    h1 { margin: 12px 0 8px; font-size: clamp(28px, 7vw, 38px); }
    p { color: #b8c4d5; line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    input { width: 100%; padding: 14px 15px; border: 1px solid #526176; border-radius: 11px; background: #0d1420; color: white; font: inherit; font-size: 16px; }
    input:focus { outline: 2px solid #60a5fa; outline-offset: 2px; }
    button { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 11px; background: #2563eb; color: white; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { font-size: 13px; margin-top: 8px; color: #aab7c8; }
    .result { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .success { display: block; border: 1px solid #287a55; background: #103324; color: #d1fae5; }
    .error { display: block; border: 1px solid #99434b; background: #3a1c24; color: #ffe4e6; }
    footer { margin-top: 24px; font-size: 12px; color: #91a0b4; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="mark">MMD GAMES · HYBRID PLAY</div>
    <h1>SPACE CONTROL</h1>
    <p>Willkommen an Bord! Gib deinen Nickname ein. Das Backend prüft deine Eingabe und bestätigt die Anmeldung.</p>
    <form id="registration-form">
      <label for="nickname">Dein Nickname</label>
      <input id="nickname" name="nickname" type="text" minlength="2" maxlength="20"
        autocomplete="nickname" placeholder="z. B. Captain Nova" required>
      <div class="hint">2–20 Zeichen · Buchstaben, Zahlen, Leerzeichen, - und _</div>
      <button id="submit-button" type="submit">Spieler anmelden</button>
    </form>
    <div id="result" class="result" role="status" aria-live="polite"></div>
    <footer>Technischer Prototyp · Keine Benutzerkonten · Keine Speicherung von Spielerdaten</footer>
  </main>
  <script src="./config.js"></script>
  <script>
    const form = document.getElementById("registration-form");
    const input = document.getElementById("nickname");
    const button = document.getElementById("submit-button");
    const result = document.getElementById("result");
    function showResult(kind, message, detail = "") {
      result.className = "result " + kind;
      result.textContent = message + (detail ? " " + detail : "");
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.className = "result";
      result.textContent = "";
      const nickname = input.value.trim();
      if (nickname.length < 2 || nickname.length > 20) {
        showResult("error", "Bitte gib einen Nickname mit 2 bis 20 Zeichen ein.");
        return;
      }
      const config = window.SPACE_CONTROL_CONFIG;
      if (!config?.supabaseUrl || !config?.supabaseAnonKey) {
        showResult("error", "Die Backend-Verbindung ist noch nicht konfiguriert.");
        return;
      }
      button.disabled = true;
      button.textContent = "Anmeldung wird geprüft …";
      try {
        const response = await fetch(config.supabaseUrl.replace(/\/$/, "") + "/functions/v1/player-registration", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": config.supabaseAnonKey,
            "Authorization": "Bearer " + config.supabaseAnonKey
          },
          body: JSON.stringify({ nickname })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
          showResult("error", data.message || "Die Anmeldung konnte nicht bestätigt werden.");
          return;
        }
        showResult("success", data.message, "Backend-Bestätigung erhalten. Es wurden keine Spielerdaten gespeichert.");
      } catch {
        showResult("error", "Das Backend ist momentan nicht erreichbar.", "Bitte prüfe die Verbindung und versuche es erneut.");
      } finally {
        button.disabled = false;
        button.textContent = "Spieler anmelden";
      }
    });
  </script>
</body>
</html>
